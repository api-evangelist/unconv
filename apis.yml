aid: unconv
name: Unconventional AI
description: Unconventional AI (unconv.ai) is rethinking the foundations of the computer
  to optimize energy efficiency for AI, working to bring biology-scale efficiency
  to artificial intelligence through analog, dynamical-system hardware co-evolved
  with neural software. Founded by experts in AI systems, analog circuits, computing
  theory, and neuroscience, and backed by Felicis, the company publishes research
  including the Un-0 image-generation model built on coupled Kuramoto oscillators
  and an instruction set architecture for dynamical-system hardware, but does not
  yet publish a public API, developer portal, or SDKs.
